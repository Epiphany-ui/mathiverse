[package]
name = "mathiverse-renderer"
version = "0.1.0"
description = "Mathiverse Local Renderer - System tray app"
authors = ["Mathiverse"]
edition = "2021"

[lib]
name = "mathiverse_renderer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
